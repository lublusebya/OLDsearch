<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OLDПОИСК :)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #e0e0e0;
    font-family: Arial, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 15px;
  }
  .container {
    background-color: #f5f5f5;
    border: 2px solid #888888;
    width: 100%; max-width: 420px;
    box-shadow: 3px 3px 0px #999999;
  }
  .header {
    background: linear-gradient(180deg, #ffffff 0%, #d0d0d0 100%);
    border-bottom: 2px solid #888888; padding: 12px 15px;
  }
  .header h1 {
    font-size: 18px; color: #333333; text-align: center; font-weight: bold;
    text-shadow: 1px 1px 0px #ffffff;
  }
  .content { padding: 15px; }

  .search-box {
    margin-bottom: 12px; background-color: #e8e8e8; border: 1px solid #aaaaaa; padding: 10px;
  }
  .search-box input {
    width: 100%; padding: 8px; font-size: 14px; border: 2px inset #999; background: #fff;
    margin-bottom: 8px;
  }
  .btn-search {
    width: 100%; padding: 12px;
    background: linear-gradient(180deg, #f0f0f0 0%, #c0c0c0 100%);
    border: 2px outset #cccccc; font-size: 16px; font-weight: bold; color: #333333;
    cursor: pointer; text-shadow: 1px 1px 0px #ffffff;
    margin-bottom: 6px;
  }
  .btn-search:active {
    border-style: inset;
    background: linear-gradient(180deg, #c0c0c0 0%, #f0f0f0 100%);
  }
  .btn-alt {
    width: 100%; padding: 10px;
    background: linear-gradient(180deg, #e8e8e8 0%, #b8b8b8 100%);
    border: 2px outset #cccccc; font-size: 14px; font-weight: bold; color: #333333;
    cursor: pointer; text-shadow: 1px 1px 0px #ffffff;
  }
  .btn-alt:active {
    border-style: inset;
    background: linear-gradient(180deg, #b8b8b8 0%, #e8e8e8 100%);
  }

  .info-text {
    font-size: 12px; color: #666; text-align: center; margin-top: 8px;
  }

  .footer {
    margin-top: 15px; text-align: center; font-size: 12px; color: #666;
    border-top: 1px solid #aaa; padding-top: 8px;
  }
  .footer a { color: #333; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>:) OLDПОИСК</h1>
  </div>
  <div class="content">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Введите запрос..." onkeydown="if(event.keyCode===13) searchDuck()">
      <button class="btn-search" onclick="searchDuck()">DuckDuckGo</button>
      <button class="btn-alt" onclick="searchAOL()">AOL Search</button>
      <button class="btn-alt" onclick="searchBing()">Bing</button>
    </div>
    <div class="info-text">
      Выберите поисковик и результат откроется в новой вкладке
    </div>
    <div class="footer">
      сайт для старых клиентов :)))<br>
      <a href="https://t.me/lublusebya1111" target="_blank">мой Telegram-канал</a>
    </div>
  </div>
</div>

<script>
  function getQuery() {
    var q = document.getElementById('searchInput').value.trim();
    if (q === '') {
      alert('Введите запрос!');
      return '';
    }
    return encodeURIComponent(q);
  }

  function searchDuck() {
    var q = getQuery();
    if (q === '') return;
    window.open('https://lite.duckduckgo.com/lite/?q=' + q, '_blank');
  }

  function searchAOL() {
    var q = getQuery();
    if (q === '') return;
    // AOL использует Bing внутри, но страница проще
    window.open('https://search.aol.com/aol/search?q=' + q, '_blank');
  }

  function searchBing() {
    var q = getQuery();
    if (q === '') return;
    window.open('https://www.bing.com/search?q=' + q, '_blank');
  }
</script>
</body>
</html>
